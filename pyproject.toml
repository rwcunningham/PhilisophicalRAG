[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "philosophy-rag"
version = "0.1.0"
description = "A LangChain/OpenAI RAG system for sourced philosophical counterarguments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.0",
  "langchain>=0.3.0",
  "langchain-chroma>=0.1.4",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "pypdf>=4.0.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
philosophy-rag = "rag_philosophy.cli:app"
philosophy-rag-api = "rag_philosophy.api:main"

[tool.setuptools.packages.find]
include = ["rag_philosophy*"]
